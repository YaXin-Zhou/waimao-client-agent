<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>NORTHSTAR 客户导入助手</title>
    <style>
      body { width: 280px; margin: 0; padding: 16px; color: #17304a; font: 13px/1.55 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 12px; color: #6b7d90; }
      button { width: 100%; border: 0; border-radius: 7px; padding: 10px; color: white; background: #1687e4; cursor: pointer; font-weight: 600; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 20px; margin-top: 10px; color: #58748e; }
      .error { color: #b34a43 !important; }
    </style>
  </head>
  <body>
    <h1>NORTHSTAR 客户导入助手</h1>
    <p>插件会自动监测本地搜索结果；打开符合条件的 Google 或 Bing 页面后，也会自动提取当前页面的官网。</p>
    <button id="import" type="button">导入当前搜索结果</button>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
